            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
