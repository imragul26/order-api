                    marketingOptedOut: false
                    sourceOfWealth: inheritance
                    sourceOfFund: bonus
                    identityVerification:
                      status: verified
                      completionTimestamp: '2019-08-24T14:15:22Z'
                      agentName: Deborah Le
                    screeningResults:
                      status: verified
                      completionTimestamp: '2019-08-24T14:15:22Z'
                      agentName: Charles Thomas
                  tradingProduct:
                    canTradeWarrants: true
                    type: domestic-equities
                    contractNote:
                      generationType: day
                      type: physical
                      postalAddress:
                        postalCode: '2264'
                        city: Lake Macquarie
                        streetAddress: 3886 Lake Rd
                        region:
                          code: NSW
                        country:
                          code: AU
                  settlement:
                    nettingPolicy: net
                    holdExcessFunds: true
                    redirectDividends: false
                    details:
                      institution:
                        code: wbc
                      accountNumber: '123456'
                      accountName: James Smith
                      branchCode: '012002'
                      entityType: Cash_Management_Account
                  adviser:
                    code: uatsentadv152
                    brokerageCode: AAB
                  termsAndConditions:
                    investorIp: 172.16.0.12
                    accepted: true
                    methodOfAcceptance: electronic-signature
                    digitalSignatureProvider: docusign
                    timestamp: '2019-08-24T14:15:22Z'
                  holdingsTransfer:
                    transferRequested: false
      x-stoplight:
        id: clod878poen3w
      security:
