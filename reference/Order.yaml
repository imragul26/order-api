    get:
      tags:
        - Client Applications
      summary: Get Client Applications
      description: Retrieve a list of Clent Applications that match the supplied criteria.
      operationId: client_applications-get
      parameters:
        - $ref: '#/components/parameters/applicationStatus_query'
        - $ref: '#/components/parameters/authorization_header'
      responses:
        '200':
          description: Retrieve a list of Client Applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'read:client_applications'
          cit:
            - 'read:client_applications'
          uat:
            - 'read:client_applications'
          tst:
            - 'read:client_applications'
          dev:
            - 'read:client_applications'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
