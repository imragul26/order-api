        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'update:client_applications'
          cit:
            - 'update:client_applications'
          uat:
            - 'update:client_applications'
          tst:
            - 'update:client_applications'
          dev:
            - 'update:client_applications'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
  '/client-applications/{id}/submit':
    post:
      tags:
        - Client Applications
      summary: Submit Client Application
      description: Submit a the specified Application for processing
      operationId: client_application-submit
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/authorization_header'
      responses:
        '200':
