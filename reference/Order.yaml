{
  "title": "Application",
  "type": "object",
  "description": "The details of an application for a new client",
  "x-tags": [
    "Models"
  ],
  "required": [
    "applicant",
    "tradingProduct",
    "settlement",
    "termsAndConditions"
  ],
  "properties": {
    "id": {
      "$ref": "../attributes/ApplicationId.json"
    },
    "status": {
      "$ref": "../attributes/ApplicationStatus.json"
    },
    "customerReferenceNumber": {
      "type": "string",
      "maxLength": 15,
      "description": "A reference number that identifies this Application within the Customer's system"
    },
    "applicant": {
      "oneOf": [
        {
          "$ref": "./Individual.json"
        },
        {
          "$ref": "./Joint.json"
        },
        {
          "$ref": "./Business.json"
        },
        {
          "$ref": "./Trust.json"
        }
      ],
      "discriminator": {
        "propertyName": "entityType",
        "mapping": {
          "individual": "#/components/schemas/Individual",
          "joint": "#/components/schemas/Joint",
          "business": "#/components/schemas/Business",
          "trust": "#/components/schemas/Trust"
        }
      }
    },
    "tradingProduct": {
      "type": "object",
      "required": [
        "type",
        "canTradeWarrants",
        "contractNote"
      ],
      "properties": {
        "type": {
          "$ref": "../attributes/TradingProductType.json"
        },
        "canTradeWarrants": {
          "type": "boolean"
        },
        "contractNote": {
          "type": "object",
          "required": [
            "type",
            "generationType"
          ],
          "properties": {
            "type": {
              "enum": [
                "digital",
                "physical"
              ],
              "description": "The channel used to send the contract note to a client"
            },
            "generationType": {
              "enum": [
                "day",
                "fill"
              ],
              "description": "Indicates whether a Contract Note is generated per Order (`fill`) or at EOD (`day`)"
            },
            "postalAddress": {
              "$ref": "../elements/Address.json",
              "description": "The postal address that will be used to send any correspondence. \n\n **Note:**  Punctuation should not be included in address fields.\n\n if `contractNote.type` is `physical` then this field is required."
            }
          }
        }
      }
    },
    "settlement": {
      "type": "object",
      "required": [
        "nettingPolicy",
        "holdExcessFunds",
        "redirectDividends"
      ],
      "properties": {
        "details": {
          "type": "object",
          "oneOf": [
            {
              "type": "array",
              "items": {
                "$ref": "./DirectEntryAccount.json"
              }
            },
            {
              "$ref": "./CashManagementAccount.json"
            }
          ]
        },
        "nettingPolicy": {
          "enum": [
            "net",
            "line-by-line"
          ],
          "description": "Determines whether we process settlements against the nominated account as line by line (T2T) or as a net amount"
        },
        "holdExcessFunds": {
          "type": "boolean",
          "description": "Used to determine whether funds are held by AUSIEX or distributed as available.",
          "x-stoplight": {
            "id": "eqni8enoxvkrp"
          }
        },
        "redirectDividends": {
          "type": "boolean",
          "description": "Indicates if the nominated settlement account should be shared with the clearer to support electronic payment of dividends.",
          "x-stoplight": {
            "id": "xrflpq3e4g8wo"
          }
        }
      }
    },
    "adviser": {
      "type": "object",
      "required": [
        "code"
      ],
      "properties": {
        "code": {
          "type": "string"
        },
        "brokerageCode": {
          "type": "string",
          "minLength": 3,
          "maxLength": 3,
          "description": "A 3-character code representing the brokerage.  If this field is not supplied, the default for your firm will be used."
        }
      }
    },
    "termsAndConditions": {
      "type": "object",
      "description": "The details of the applicant accepting the terms and conditions",
      "required": [
        "accepted",
        "methodOfAcceptance",
        "timestamp",
        "investorIp"
      ],
      "properties": {
        "accepted": {
          "type": "boolean",
          "description": "An positive indicator that the terms and conditions have been accepted."
        },
        "methodOfAcceptance": {
          "enum": [
            "electronic-signature",
            "wet-signature",
            "electronic-acceptance",
            "delegate"
          ],
          "description": "Captures the method that was used by the client to accept the terms and conditions.\n\nValues | Description |\r\n|------|------|\r\n| electronic-signature | Acceptance was captured using an electronic signature platform (i.e., DocuSign). |\r\n| wet-signature | Acceptance was provided via a physical, handwritten signature on paper. |\r\n|  electronic-acceptance | Acceptance was given through a digital interface, such as clicking a checkbox or button online. |\r\n|  delegate | Acceptance was confirmed by a third party (i.e., a financial institution like Westpac) acting on behalf of the individual or entity, ensuring that the terms and conditions were accepted."
        },
        "digitalSignatureProvider": {
          "enum": [
            "docusign",
            "annature"
          ],
          "description": "Captures which electronic signature provider was utilised to capture the acceptance of the terms and conditions.\n\nIf `methodOfAcceptance` is `electronic-signature` then this field is required.\n\nThis field will also impact the number of documents that wil be required to be uploaded with the application as outlined below:\n- `docusign`: Two documents will need to be uploaded, one which is the electronically signed application and the second is the signing certificate provided by DocuSign.\n- `annature`: One document will need to be uploaded containing both the electronically signed application and the signing certificate."
        },
        "timestamp": {
          "type": "string",
          "format": "date-time",
          "description": "The timestamp of when the client accepted the terms and conditions. This should be captured in ISO 8601 format."
        },
        "investorIp": {
          "type": "string",
          "description": "The IP address from which the investor accessed the platform or submitted their application. Used for audit logging and compliance tracking."
        }
      }
    },
    "holdingsTransfer": {
      "type": "object",
      "description": "Details related to a Holdings Transfer request as part of the application.",
      "required": [
        "transferRequested"
      ],
      "properties": {
        "transferRequested": {
          "type": "boolean",
          "description": "Indicates whether the application is for a Holdings Transfer. If set to false, it will be considered a HIN request."
        },
        "transferDetails": {
          "type": "object",
          "description": "Details of an existing HIN to transfer to AUSIEX as part of the application. If this isn't supplied a new HIN will be created for this applicant.",
          "required": [
            "hin",
            "pid"
          ],
          "properties": {
            "hin": {
              "type": "string",
              "description": "The ID of the account for the existing holding."
            },
            "pid": {
              "type": "string",
              "minLength": 5,
              "maxLength": 5,
              "pattern": "^[0-9]{5}",
              "example": "06382",
              "description": "The participant ID for the sponsor of the HIN. This is a 5-digit, zero-padded number."
            }
          }
        }
      }
    }
  }
}