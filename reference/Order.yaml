      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
  '/client-applications/{id}/cancel':
    post:
      tags:
        - Client Applications
      summary: Cancel Client Application
      description: Request the specified Application to be marked as cancelled.
      operationId: client_application-cancel
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/authorization_header'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'cancel:client_applications'
          cit:
            - 'cancel:client_applications'
          uat:
            - 'cancel:client_applications'
          tst:
            - 'cancel:client_applications'
          dev:
            - 'cancel:client_applications'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
  '/client-applications/{id}/validate':
    post:
      tags:
        - Client Applications
      summary: Validate Client Application
      description: Requests validation of the specified Application.
      operationId: client_application-validate
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/authorization_header'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationSummary'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'submit:client_applications'
          cit:
            - 'submit:client_applications'
          uat:
            - 'submit:client_applications'
          tst:
            - 'submit:client_applications'
          dev:
            - 'submit:client_applications'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
  '/client-applications/{id}/documents':
    post:
      tags:
        - Documents
      summary: Upload Document for a Client Application
      description: Upload a document and associate it with the specified Application.
      operationId: document-create
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/authorization_header'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: The document file to be uploaded. Maximum allowed file size is 5MB
                  contentMediaType: application/octet-stream
                documentType:
                  $ref: '#/components/schemas/Document_Types'
              required:
                - file
                - documentType
      responses:
        '200':
          description: Document successfully uploaded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'create:client_applications-documents'
          cit:
            - 'create:client_applications-documents'
          uat:
            - 'create:client_applications-documents'
          tst:
            - 'create:client_applications-documents'
          dev:
            - 'create:client_applications-documents'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
  '/client-applications/{id}/sign-link':
    get:
      tags:
        - Attestations
      summary: Generate Sign Link
      description: Returns a sign-in link to be provided to each specified party that must accept the AUSIEX terms and conditions.
      operationId: client_application_sign_link-get
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/authorization_header'
      responses:
        '200':
          description: Obtain URLs for signatories to provide online attestations.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attestationLinks:
                    type: array
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          format: email
                        url:
                          type: string
                          format: uri
                      required:
                        - email
                        - url
                required:
                  - attestationLinks
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/BadGateway'
      security:
        - production:
            - 'create:client_applications-attestation-sign_links'
          cit:
            - 'create:client_applications-attestation-sign_links'
          uat:
            - 'create:client_applications-attestation-sign_links'
          tst:
            - 'create:client_applications-attestation-sign_links'
          dev:
            - 'create:client_applications-attestation-sign_links'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
tags:
  - name: Attestations
    description: Operations on Attestations
  - name: Client Applications
    description: Operations on Client Applications
  - name: Documents
    description: Documents related to an application
components:
  parameters:
    applicationStatus_query:
      name: application-status
      in: query
      description: The status of an application
      required: false
      schema:
        type: string
        enum:
          - draft
          - submitted
          - cancelled
    applicationId_path:
      name: id
      in: path
      description: The ID of the Client Application resource
      required: true
      schema:
        type: string
    requestId_header:
      name: X-Request-ID
      in: header
      description: A unique ID that represents this request. This is used to prevent the processing of non-idempotent requests multiple times. This can be any value that you choose as long as it will remain unique within your user context for a 24hr rolling window
      required: true
      schema:
        type: string
        maxLength: 50
    authorization_header:
      name: Authorization
      in: header
      description: Contains the bearer access token for authentication and authorisation
      required: true
      schema:
        type: string
  securitySchemes:
    production:
      type: oauth2
      flows:
        clientCredentials:
          refreshUrl: ''
          scopes:
            'read:client_applications': Allow reading Client Application resources
            'create:client_applications': Allow creation of Client Application resources
            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
            'create:client_applications-attestation-sign_links': Create a sign link to capture a Client Application Attestation
          tokenUrl: 'https://auth.ausiex.com.au/oauth2/token'
    cit:
      type: oauth2
      flows:
        clientCredentials:
          refreshUrl: ''
          scopes:
            'read:client_applications': Allow reading Client Application resources
            'create:client_applications': Allow creation of Client Application resources
            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
            'create:client_applications-attestation-sign_links': Create a sign link to capture a Client Application Attestation
          tokenUrl: 'https://auth.cit.ausiex.com.au/oauth2/token'
    uat:
      type: oauth2
      flows:
        clientCredentials:
          refreshUrl: ''
          scopes:
            'read:client_applications': Allow reading Client Application resources
            'create:client_applications': Allow creation of Client Application resources
            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
            'create:client_applications-attestation-sign_links': Create a sign link to capture a Client Application Attestation
          tokenUrl: 'https://auth.cit.ausiex.com.au/oauth2/token'
    tst:
      type: oauth2
      flows:
        clientCredentials:
          refreshUrl: ''
          scopes:
            'read:client_applications': Allow reading Client Application resources
            'create:client_applications': Allow creation of Client Application resources
            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
            'create:client_applications-attestation-sign_links': Create a sign link to capture a Client Application Attestation
          tokenUrl: 'https://auth.tst.ausiex.com.au/oauth2/token'
    dev:
      type: oauth2
      flows:
        clientCredentials:
          refreshUrl: ''
          scopes:
            'read:client_applications': Allow reading Client Application resources
            'create:client_applications': Allow creation of Client Application resources
            'update:client_applications': Allow amending Client Application resources
            'submit:client_applications': Allow submission of Client Applications for processing
            'cancel:client_applications': Allow cancellation of Client Applications
            'create:client_applications-documents': Allow creation of Client Application documents
            'create:client_applications-attestation': Allow write of Client Application Attestations resources
            'create:client_applications-attestation-sign_links': Create a sign link to capture a Client Application Attestation
          tokenUrl: 'https://auth.dev.ausiex.com.au/oauth2/token'
  responses:
    ApplicationSummary:
      description: A response containing the summary of the specified Application.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Application_Summary'
          examples:
            Invalid Field Value:
              value:
                id: 3a446a7d-0ab8-4580-9d99-731631bb4791
                applicationStatus: draft
                validationStatus: invalid
                errors:
                  - errorCode: ERR_005
                    errorDescription: Length of the field doesn't meet the requirements.
                    attributeType: field
                    attributeName: applicant.person.middleName
            Valid Applicaiton:
              value:
                id: fe18a6be-05b5-4623-a038-d83d8062e89f
                applicationStatus: draft
                validationStatus: valid
                errors: []
    ApplicationDetail:
      description: A response containing the all the details of the specified Application.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Application_Full_Details'
    BadRequest:
      description: The supplied request doesn't meet the requirements of the endpoint. Please see the response body for detailed information on the issues.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error_Details'
    BadGateway:
      description: 'There was an issue between the Gateway and the backend gateway, please try again later.'
    Unauthenticated:
      description: You have supplied invalid or expired authentication information
    Unauthorised:
      description: You have valid credentials but are not authorised to make this request.
    InternalError:
      description: An internal server error has occured.
    NotFound:
      description: A resource with the supplied ID was not found.
    AttestationCreated:
      description: The response returned when an attestation successfully registered.
      content:
        application/json:
          schema:
            type: object
            properties:
              attestationId:
                type: string
            required:
              - attestationId
  schemas:
    Application:
      type: object
      title: Application
      description: The details of an application for a new client
      properties:
        id:
          $ref: '#/components/schemas/ApplicationId'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        customerReferenceNumber:
          type: string
          description: A reference number that identifies this Application within the Customer's system
          maxLength: 15
        applicant:
          oneOf:
            - $ref: '#/components/schemas/Individual'
            - $ref: '#/components/schemas/Joint'
            - $ref: '#/components/schemas/Business'
            - $ref: '#/components/schemas/Trust'
          discriminator:
            propertyName: entityType
            mapping:
              individual: '#/components/schemas/Individual'
              joint: '#/components/schemas/Joint'
              business: '#/components/schemas/Business'
              trust: '#/components/schemas/Trust'
        tradingProduct:
          type: object
          properties:
            type:
              $ref: '#/components/schemas/Trading_Product_Type'
            canTradeWarrants:
              type: boolean
            contractNote:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - digital
                    - physical
                  description: The channel used to send the contract note to a client
                generationType:
                  type: string
                  enum:
                    - day
                    - fill
                  description: Indicates whether a Contract Note is generated per Order (`fill`) or at EOD (`day`)
                postalAddress:
                  $ref: '#/components/schemas/Address'
                  description: |-
                    The postal address that will be used to send any correspondence. 

                     **Note:**  Punctuation should not be included in address fields.

                     if `contractNote.type` is `physical` then this field is required.
              required:
                - type
                - generationType
          required:
            - type
            - canTradeWarrants
            - contractNote
        settlement:
          type: object
          properties:
            details:
              oneOf:
                - $ref: '#/components/schemas/Direct_Entry_Account_Map'
                - $ref: '#/components/schemas/Cash_Management_Account'
              discriminator:
                propertyName: entityType
                mapping:
                  direct-entry-account: '#/components/schemas/Direct_Entry_Account_Map'
                  cash-management-account: '#/components/schemas/Cash_Management_Account'
            nettingPolicy:
              type: string
              enum:
                - net
                - line-by-line
              description: Determines whether we process settlements against the nominated account as line by line (T2T) or as a net amount
            holdExcessFunds:
              type: boolean
              description: Used to determine whether funds are held by AUSIEX or distributed as available.
            redirectDividends:
              type: boolean
              description: Indicates if the nominated settlement account should be shared with the clearer to support electronic payment of dividends.
          required:
            - details
            - nettingPolicy
            - holdExcessFunds
            - redirectDividends
        adviser:
          type: object
          properties:
            code:
              type: string
            brokerageCode:
              type: string
              description: 'A 3-character code representing the brokerage.  If this field is not supplied, the default for your firm will be used.'
              minLength: 3
              maxLength: 3
          required:
            - code
        termsAndConditions:
          type: object
          description: The details of the applicant accepting the terms and conditions
          properties:
            accepted:
              type: boolean
              description: An positive indicator that the terms and conditions have been accepted.
            methodOfAcceptance:
              type: string
              enum:
                - electronic-signature
                - wet-signature
                - electronic-acceptance
                - delegate
              description: "Captures the method that was used by the client to accept the terms and conditions.\n\nValues | Description |\r\n|------|------|\r\n| electronic-signature | Acceptance was captured using an electronic signature platform (i.e., DocuSign). |\r\n| wet-signature | Acceptance was provided via a physical, handwritten signature on paper. |\r\n|  electronic-acceptance | Acceptance was given through a digital interface, such as clicking a checkbox or button online. |\r\n|  delegate | Acceptance was confirmed by a third party (i.e., a financial institution like Westpac) acting on behalf of the individual or entity, ensuring that the terms and conditions were accepted."
            digitalSignatureProvider:
              type: string
              enum:
                - docusign
                - annature
              description: |-
                Captures which electronic signature provider was utilised to capture the acceptance of the terms and conditions.

                If `methodOfAcceptance` is `electronic-signature` then this field is required.

                This field will also impact the number of documents that wil be required to be uploaded with the application as outlined below:
                - `docusign`: Two documents will need to be uploaded, one which is the electronically signed application and the second is the signing certificate provided by DocuSign.
                - `annature`: One document will need to be uploaded containing both the electronically signed application and the signing certificate.
            timestamp:
              type: string
              description: The timestamp of when the client accepted the terms and conditions. This should be captured in ISO 8601 format.
              format: date-time
            investorIp:
              type: string
              description: The IP address from which the investor accessed the platform or submitted their application. Used for audit logging and compliance tracking.
          required:
            - accepted
            - methodOfAcceptance
            - timestamp
            - investorIp
        holdingsTransfer:
          type: object
          description: Details related to a Holdings Transfer request as part of the application.
          properties:
            transferRequested:
              type: boolean
              description: 'Indicates whether the application is for a Holdings Transfer. If set to false, it will be considered a HIN request.'
            transferDetails:
              type: object
              description: Details of an existing HIN to transfer to AUSIEX as part of the application. If this isn't supplied a new HIN will be created for this applicant.
              properties:
                hin:
                  type: string
                  description: The ID of the account for the existing holding.
                pid:
                  type: string
                  description: 'The participant ID for the sponsor of the HIN. This is a 5-digit, zero-padded number.'
                  pattern: '^[0-9]{5}'
                  minLength: 5
                  maxLength: 5
                  examples:
                    - '06382'
              required:
                - hin
                - pid
          required:
            - transferRequested
