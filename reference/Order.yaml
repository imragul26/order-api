      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
          description: Client Integration Testing
    put:
      tags:
        - Client Applications
      summary: Update a Client Application
      description: Update the specified Application with the supplied details
      operationId: application-update
      parameters:
        - $ref: '#/components/parameters/applicationId_path'
        - $ref: '#/components/parameters/requestId_header'
        - $ref: '#/components/parameters/authorization_header'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Application'
      responses:
        '200':
          $ref: '#/components/responses/ApplicationSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
