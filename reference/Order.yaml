            examples:
              'E: Individual P: Equity S: CMA':
                value:
                  customerReferenceNumber: ebf26e85-9a7e
                  applicant:
                    entityType: Individual
                    person:
                      firstName: Denise
                      title: dr
                      middleName: David De
                      lastName: Ramirez
                      residentialAddress:
                        postalCode: '2956'
                        city: Steelebury
                        streetAddress: 53842 Street Rd
                        region:
                          code: NSW
                        country:
                          code: AU
                      postalAddress:
                        postalCode: '4990'
                        city: Lake Anthony
                        streetAddress: 3886 Road St
                        region:
                          code: NSW
                        country:
                          code: AU
                      emailAddresses:
                        - type: home
                          value: miguelmendoza@anderson.com
                          isPreferred: true
                      phoneNumbers:
                        - isPreferred: true
                          type: mobile
                          value: '+447911123456'
                      dateOfBirth: '1968-08-28'
