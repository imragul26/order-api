openapi: 3.1.0
info:
  version: '1.3'
  title: Origination
  summary: A service for AUSIEX customers to manage their relationship and clients
  description: Used by AUSIEX customers to manage their relationship and clients.
  termsOfService: www.ausiex.com.au
  contact:
    name: Technical Support
    url: www.ausiex.com.au
    email: support@ausiex.com.au
  license:
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
    name: Apache v2.0
servers:
  - url: 'https://api.ausiex.com.au/v1'
    description: Production
  - url: 'https://api.cit.ausiex.com.au/v1'
    description: Client Integration Testing
paths:
  /client-applications:
    post:
      tags:
        - Client Applications
      summary: Create Client Application
      description: Create a new Application
      operationId: client_application-create
