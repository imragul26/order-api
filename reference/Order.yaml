      security:
        - production:
            - 'create:client_applications'
          cit:
            - 'create:client_applications'
          uat:
            - 'create:client_applications'
          tst:
            - 'create:client_applications'
          dev:
            - 'create:client_applications'
      servers:
        - url: 'https://api.ausiex.com.au/v1'
          description: Production
        - url: 'https://api.cit.ausiex.com.au/v1'
